# Hytera IP Multi-site Connect master — registration-only first milestone.
# CPS: Repeater Type = Slave, Master UDP Port = 50000.
# Enable Voice & Data on UDP 50001. Leave RDAC disabled for the first test.
#
# With GENERATOR > 1 each slot consumes three consecutive backend ports:
# HYTERA-0 = PORT/DMR_PORT/RDAC_PORT, HYTERA-1 = each value + 3, etc.
[HYTERA]
MODE: HYTERA
ENABLED: True
REPEAT: True
MAX_PEERS: 1
IP:
PORT: 50000
DMR_PORT: 50001
RDAC_PORT: 50002
GENERATOR: 1

# Set this once the RD985 DMR repeater ID is known. Zero permits handshake
# discovery but suppresses the dashboard peer row until identity is known.
HYTERA_REPEATER_ID: 0
KEEPALIVE_WATCHDOG: 60
TRACE_PACKETS: False
ALLOWED_PEER_IDS:
ALLOWED_PEER_IPS:

GROUP_HANGTIME: 5
USE_ACL: True
REG_ACL: PERMIT:ALL
SUB_ACL: DENY:1
TGID_TS1_ACL: PERMIT:ALL
TGID_TS2_ACL: PERMIT:ALL
DEFAULT_UA_TIMER: 10
SINGLE_MODE: True
VOICE_IDENT: False
TS1_STATIC:
TS2_STATIC:
DEFAULT_REFLECTOR: 0
STICKY_TG: False
ANNOUNCEMENT_LANGUAGE: en_GB
ALLOW_UNREG_ID: True
PROXY_CONTROL: False
OVERRIDE_IDENT_TG:
