# Hytera IP Multi-site Connect NAT-aware proxy.
# The proxy owns the public CPS ports. RYSEN owns the generated backend triples.
#
# CPS public settings for every repeater:
# Master UDP / P2P Firewall: 50000
# Voice and Data UDP: 50001
# RDAC UDP: 50002
# The proxy redirects later repeaters onto free public triples from 50003.
# Only a second repeater behind the same public address programs its master
# port to the next triple, beginning at 50003.
[HYTERA_PROXY]
MASTER = 172.16.238.10
LISTENIP =
P2P_PORT = 50000
PUBLIC_SLOT_START = 50000
BACKEND_SLOT_START = 50003
SLOTS = 10
TIMEOUT = 60
DEBUG = False
BLACKLIST = []
IPBLACKLIST = {}
